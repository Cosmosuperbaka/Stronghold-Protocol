<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>卫戍协议 · 主机控制台</title>
<style>
  :root { color-scheme: dark; --bg: #0c0f0e; --panel: #141816; --line: #2f3a35; --mint: #4ed8af; --text: #dfe6e2; --dim: #8a9a92; --warn: #f6a329; --red: #e85a4a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; color: var(--mint); }
  h2 { margin: 0; font-size: 16px; }
  main { padding: 16px 20px; display: grid; gap: 16px; }
  main[hidden] { display: none; }
  .room { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .meta { color: var(--dim); }
  .tag { padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; }
  .tag.phase { border-color: var(--mint); color: var(--mint); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; }
  button, input, select { font: inherit; color: var(--text); background: #1e2421; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--mint); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { border-color: var(--mint); color: var(--mint); }
  button.danger { border-color: var(--red); color: var(--red); }
  a.replay-link { display: inline-block; color: var(--mint); padding: 3px 8px; text-underline-offset: 3px; }
  #storage-form label { display: block; margin: 8px 0; }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 1px; }
  input.num { width: 72px; }
  .grant { width: 200px; }
  .autocomplete { display: inline-flex; }
  .candidate-options { position: fixed; z-index: 10; width: 320px; max-width: calc(100vw - 24px); max-height: 240px; overflow: auto; padding: 3px; background: #1e2421; border: 1px solid var(--mint); border-radius: 4px; box-shadow: 0 5px 14px #0008; }
  .candidate-options[hidden] { display: none; }
  .candidate-options [role="option"] { display: block; padding: 5px 8px; cursor: pointer; white-space: normal; overflow-wrap: anywhere; }
  .candidate-options [role="option"]:hover, .candidate-options [role="option"][aria-selected="true"] { background: #2b3c35; color: var(--mint); }
  #status { margin-left: auto; color: var(--dim); }
  #msg { position: fixed; right: 20px; bottom: 20px; max-width: 420px; padding: 10px 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); display: none; }
  #msg.err { border-color: var(--red); }
  .off { color: var(--dim); }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  tr.detail > td { white-space: normal; background: #101311; padding: 10px 12px 14px; }
  .panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .panes h3 { margin: 0 0 4px; font-size: 13px; color: var(--mint); font-weight: normal; }
  .panes table { margin-top: 0; }
  .panes td, .panes th { padding: 3px 6px; }
  .panes ul { margin: 4px 0 8px; padding-left: 18px; }
  .scroll { max-height: 280px; overflow: auto; }
  .on { color: var(--mint); }
  .note { color: var(--warn); font-size: 12px; margin: 4px 0 0; }
  input.small { width: 64px; }
  nav { display: flex; gap: 4px; }
  nav button[aria-pressed="true"] { border-color: var(--mint); color: var(--mint); }
  details.stats { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.stats > summary { cursor: pointer; color: var(--mint); }
  .stats-body { display: grid; gap: 14px; margin-top: 8px; }
  .stats-body h3 { margin: 0 0 4px; font-size: 13px; color: var(--mint); font-weight: normal; }
  .stats-body table { margin-top: 0; }
  .stats-body td, .stats-body th { padding: 3px 8px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .xscroll { overflow-x: auto; }
  .chart-wrap { position: relative; max-width: 760px; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; font-size: 12px; }
  .legend span::before, .tip .k { content: ""; display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--c); }
  .tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tip b { font-weight: normal; color: var(--dim); display: block; margin-bottom: 2px; }
  .tip .v { display: inline-block; min-width: 56px; text-align: right; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .units { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 16px; }
  .units ol { margin: 2px 0 0; padding-left: 20px; }
  .good { color: var(--mint); }
  .dmg-bar { display: block; height: 10px; border-radius: 0 4px 4px 0; background: var(--c); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .bad { color: var(--red); }
  #release-update select { max-width: 100%; width: min(100%, 440px); }
  #release-update .network-field { display: grid; gap: 4px; max-width: 640px; }
  #release-update .network-field input { width: 100%; min-width: 0; }
  #release-update summary { cursor: pointer; }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; gap: 8px 12px; }
    header h1, header nav { flex-shrink: 0; }
    header > .meta { flex-basis: 100%; }
    #status { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>主机控制台</h1>
  <nav aria-label="页面"><button data-tab="rooms" aria-pressed="true">房间</button><button data-tab="records" aria-pressed="false">对局记录</button><button data-tab="settings" aria-pressed="false">设置</button></nav>
  <span class="meta">只能在这台电脑上打开 · 修改直接生效、不扣金币；只有「加层」「补发机变卡」「装备」会触发游戏效果</span>
  <span id="status" aria-live="polite"></span>
</header>
<main id="rooms"></main>
<main id="records" hidden></main>
<main id="settings" hidden></main>
<datalist id="chess-list"></datalist>
<datalist id="item-list"></datalist>
<datalist id="equip-list"></datalist>
<datalist id="card-list"></datalist>
<div id="msg" role="status" aria-live="polite"></div>
<script>
const TOKEN = '__TOKEN__';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const api = (p, body) => fetch(p, { method: body ? 'POST' : 'GET', headers: { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) })
  .then((r) => r.json());

let catalogRoom = null;
let catalogPending = null;
const names = { chess: new Map(), diy: new Map(), item: new Map(), equip: new Map(), card: new Map() };
const idNames = new Map(); // operator / item / card id → its catalog label (the action log)
const diyEntries = new Map(); // 发放自选 label → its catalog entry (skills, modules, locked, def)
const diyDraft = new Map(); // player id → { label, skill, mod }: the 发放自选 controls survive the re-renders
const open = new Set(); // players whose 详情 row is expanded

function say(text, err = false) {
  const el = $('#msg');
  el.textContent = text;
  el.className = err ? 'err' : '';
  el.style.display = 'block';
  clearTimeout(say.t);
  say.t = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function act(room, action, playerId, value, label) {
  const send = (v) => api('/api/action', { room, action, playerId, value: v }).catch(() => ({ error: '连接服务器失败' }));
  let r = await send(value);
  if ((action === 'item' || action === 'pieceEquip') && r.code === 'ITEM_STOCK_CONFIRM') {
    if (!await confirmStock(r.error)) { say('已取消发放装备'); return; }
    r = await send(action === 'item' ? { id: value, force: true } : { ...value, force: true });
  }
  if (r.ok) say(`${label || action}：完成${r.round ? `（第 ${r.round} 回合）` : ''}`);
  else say(`${label || action}失败：${r.error}${r.detail ? `（${r.detail}）` : ''}`, true);
  refresh();
}

function confirmStock(message) {
  return new Promise((resolve) => {
    const dialog = document.createElement('dialog');
    dialog.dataset.stockConfirm = '';
    dialog.setAttribute('aria-labelledby', 'stock-confirm-title');
    dialog.innerHTML = `<form method="dialog"><h3 id="stock-confirm-title">装备库存不足</h3><p>${esc(message)}</p><button value="no" autofocus>否</button> <button value="yes">是，强制加入</button></form>`;
    dialog.style.cssText = 'max-width:min(480px,85vw);background:#141816;color:#eee;border:1px solid #657269;border-radius:8px;padding:20px';
    dialog.addEventListener('close', () => { const yes = dialog.returnValue === 'yes'; dialog.remove(); resolve(yes); }, { once: true });
    document.body.append(dialog);
    dialog.showModal();
  });
}

function loadCatalog(room) {
  if (catalogRoom === room) return catalogPending;
  catalogRoom = room;
  catalogPending = api(`/api/catalog?room=${encodeURIComponent(room)}`).then((c) => {
    if (c.error) throw new Error(c.error);
    if (catalogRoom !== room) return;
    const fill = (list, kind, sel) => {
      names[kind].clear();
      $(sel).innerHTML = list.map((x) => {
        const label = `${x.name}（${x.tier}费）`;
        names[kind].set(label, x.id);
        idNames.set(x.id, label);
        let opts = `<option value="${esc(label)}"></option>`;
        if (x.goldenId) { const g = `${x.name}·精锐（${x.tier}费）`; names[kind].set(g, x.goldenId); opts += `<option value="${esc(g)}"></option>`; }
        return opts;
      }).join('');
    };
    fill(c.chess, 'chess', '#chess-list');
    // Any kitted operator at tier 5 / 6, normal or elite (match/adminDiy.js).
    names.diy.clear();
    diyEntries.clear();
    (c.diy || []).forEach((x) => [false, true].forEach((elite) => {
      const label = `${x.name}${elite ? '·精锐' : ''}（自选 ${x.tier} 阶）`;
      names.diy.set(label, { charId: x.charId, tier: x.tier, elite });
      diyEntries.set(label, x);
    }));
    fill(c.items, 'item', '#item-list');
    fill(c.items.filter((x) => x.equip), 'equip', '#equip-list');
    names.card.clear();
    $('#card-list').innerHTML = c.cards.map((x) => {
      const label = `${x.name}${x.kind === 'bounty' ? '（悬赏）' : x.team ? '（全队）' : ''}`;
      names.card.set(label, x.id);
      idNames.set(x.id, label);
      return `<option value="${esc(label)}"></option>`;
    }).join('');
  }).catch((e) => { if (catalogRoom === room) catalogRoom = null; throw e; });
  return catalogPending;
}

// data attributes of a button that acts on one player
const on = (code, p, action, label) => `data-room="${code}" data-player="${esc(p.id)}" data-click="${action}" data-label="${label}"`;

function candidateInput(kind, code, pid, attrs, uid = '') {
  const id = `candidates-${code}-${pid}-${kind}-${uid}`;
  return `<span class="autocomplete"><input class="grant" data-candidate-kind="${kind}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${esc(id)}" autocomplete="off" ${attrs}><span class="candidate-options" id="${esc(id)}" data-candidates ${kind === 'diy' ? 'data-diy-options' : ''} role="listbox" aria-label="候选项" hidden></span></span>`;
}

function detailRow(code, p, cols) {
  const at = (label) => `data-room="${code}" data-player="${esc(p.id)}" data-label="${label}"`;
  const bondRows = (list) => list.map((b) => `<tr>
      <td class="${b.active ? 'on' : ''}">${esc(b.name)}</td>
      <td>${b.count} / ${esc(b.thresholds.join('·'))}</td>
      <td>${b.layers}
        <input class="small" type="number" min="1" placeholder="+层" aria-label="${esc(p.name)} ${esc(b.name)} 增加层数" data-act="bondAdd" data-bond="${b.id}" ${at(`${esc(b.name)} 加层`)} data-clear>
        <input class="small" type="number" min="0" max="999" placeholder="设为" aria-label="${esc(p.name)} ${esc(b.name)} 设定层数" data-act="bondSet" data-bond="${b.id}" ${at(`${esc(b.name)} 设层`)} data-clear></td>
      <td><input class="small" type="number" value="${b.bonus}" aria-label="${esc(p.name)} ${esc(b.name)} 人数加成" data-act="bondBonus" data-bond="${b.id}" ${at(`${esc(b.name)} 人数加成`)}></td>
    </tr>`).join('');
  const used = p.bonds.filter((b) => b.count || b.layers || b.bonus || b.active);
  const others = p.bonds.filter((b) => !used.includes(b));
  const pieceRows = p.pieces.map((x) => `<tr>
      <td>${esc(x.where)}</td>
      <td>${esc(x.name)}${x.golden ? ' <span class="tag on">精锐</span>' : ''}${x.count > 1 ? ` ×${x.count}` : ''}${x.items.length ? `<br><span class="meta">${x.items.map((i) => esc(i.name)).join('、')}</span>` : ''}</td>
      <td class="row">
        ${x.canPromote ? `<button ${on(code, p, 'piecePromote', '升为精锐')} data-value="${x.uid}">升精锐</button>` : ''}
        ${x.kind === 'chess' ? candidateInput('equip', code, p.id, `placeholder="装备…" aria-label="给 ${esc(x.name)} 装备" data-equip="${x.uid}" ${at('装备')}`, x.uid) : ''}
        <button class="danger" ${on(code, p, 'pieceRemove', '移除')} data-value="${x.uid}" data-confirm="移除 ${esc(x.name)}？不退金币。">移除</button>
      </td></tr>`).join('');
  const effects = [
    ...p.effects.map((e) => `<li>${esc(e.name)}${e.counter != null ? ` <span class="meta">(${esc(e.counter)})</span>` : ''}
      <button ${on(code, p, 'effectRemove', '删除效果')} data-value="${esc(e.id)}" aria-label="删除效果 ${esc(e.name)}">删除</button>
      ${e.desc ? `<br><span class="meta">${esc(e.desc)}</span>` : ''}</li>`),
    ...p.bounties.map((b) => `<li>悬赏：${esc(b.name)} <span class="meta">剩 ${b.roundsLeft} 场</span>
      <button ${on(code, p, 'bountyRemove', '删除悬赏')} data-value="${esc(b.id)}" aria-label="删除悬赏 ${esc(b.name)}">删除</button></li>`),
  ].join('');
  const enemies = p.enemies.map((e) => `<li>${esc(e.name)} ×${e.count}${e.elite ? ' <span class="tag">精英</span>' : ''}${e.boss ? ' <span class="tag">领袖</span>' : ''}${e.fly ? ' <span class="meta">飞行</span>' : ''}${e.bounty ? ' <span class="meta">悬赏</span>' : ''}</li>`).join('');
  return `<tr class="detail"><td colspan="${cols}"><div class="panes">
    <div><h3>盟约</h3>
      <p class="meta">加层走游戏逻辑（会触发获得层数的效果），设层直接改、不触发效果。层数只在盟约激活时生效，人数加成可以强行激活。</p>
      <div class="scroll"><table><thead><tr><th scope="col">盟约</th><th scope="col">人数/门槛</th><th scope="col">层数</th><th scope="col">人数加成</th></tr></thead>
      <tbody>${bondRows(used) || '<tr><td colspan="4" class="meta">还没有盟约</td></tr>'}</tbody></table>
      ${others.length ? `<details><summary class="meta">其他盟约（${others.length}）</summary><table><tbody>${bondRows(others)}</tbody></table></details>` : ''}</div></div>
    <div><h3>效果与机变卡</h3><ul>${effects || '<li class="meta">没有效果</li>'}</ul>
      ${candidateInput('card', code, p.id, `style="width:240px" placeholder="补发机变卡…" aria-label="${esc(p.name)} 补发机变卡" data-grant="card" ${at('补发机变卡')}`)}
      <p class="note">标「全队」的卡会同时作用到所有存活队友。</p></div>
    <div><h3>棋盘、手牌、整备区</h3><div class="scroll"><table><tbody>${pieceRows || '<tr><td class="meta">空</td></tr>'}</tbody></table></div>
      <p class="meta">移除不退金币，卡池拷贝归还，装备回到手牌。装备不受阶段限制。</p></div>
    <div><h3>下一场的敌人</h3><ul>${enemies || '<li class="meta">暂无</li>'}</ul></div>
  </div></td></tr>`;
}

/** The skill / module selects and 改技能 of a player's 发放自选 box (from its draft; disabled until an operator is named). */
function diySelects(code, pid) {
  const d = diyDraft.get(pid) || { label: '', skill: '', mod: '' };
  const e = diyEntries.get(d.label);
  const off = !e || e.locked ? 'disabled' : '';
  const sel = (v, cur) => (String(v) === String(cur) ? 'selected' : '');
  const skills = e && e.locked ? `<option>技能：锁定 S${e.locked.skillIndex + 1}</option>`
    : `<option value="">技能：默认${e ? ` S${e.def.skillIndex + 1}` : ''}</option>${(e?.skills || []).map((x) => `<option value="${x.index}" ${sel(x.index, d.skill)}>S${x.index + 1} ${esc(x.name)}</option>`).join('')}`;
  const mods = e && e.locked ? '<option>模组：锁定</option>'
    : `<option value="">模组：默认</option><option value="none" ${sel('none', d.mod)}>不装备</option>${(e?.modules || []).map((x) => `<option value="${esc(x.id)}" ${sel(x.id, d.mod)}>${esc(x.type)} ${esc(x.name)}</option>`).join('')}`;
  const at = `data-player="${esc(pid)}" data-room="${code}"`;
  return `<select data-diy-skill ${at} ${off} aria-label="自选技能">${skills}</select><select data-diy-mod ${at} ${off} aria-label="自选模组">${mods}</select><button data-diy-set ${at} ${off} title="只改这名干员所在自选位的技能和模组，已有的棋子一起变">改技能</button>`;
}
/** The 发放自选 action value of a player's draft, or null (no operator named). */
function diyValue(pid, label) {
  const v = names.diy.get(label);
  if (!v) return null;
  const d = diyDraft.get(pid) || {};
  return { ...v, ...(d.skill !== '' && d.skill != null ? { skillIndex: Number(d.skill) } : null), ...(d.mod ? { uniEquipId: d.mod } : null) };
}
/** The action log's label of a 发放自选 value. */
function diyLabel(label, v) {
  const e = diyEntries.get(label);
  const sk = v.skillIndex != null ? ` S${v.skillIndex + 1}` : '';
  const md = v.uniEquipId === 'none' ? ' 不装备模组' : v.uniEquipId ? ` ${e?.modules.find((x) => x.id === v.uniEquipId)?.type || v.uniEquipId}` : '';
  return `${label}${sk}${md}`;
}

function playerRow(code, p) {
  const who = `${esc(p.name)}${p.bot ? ' <span class="tag">AI</span>' : ''}${p.connected ? '' : ' <span class="tag off">离线</span>'}${p.alive ? '' : ' <span class="tag off">淘汰</span>'}`;
  const field = (action, value, label) => `<input class="num" type="number" value="${value}" aria-label="${esc(p.name)} ${label}" data-act="${action}" data-player="${esc(p.id)}" data-room="${code}" data-label="${label}">`;
  return `<tr>
    <td>${who}</td>
    <td>${field('lp', p.lp, 'LP')}</td>
    <td>${p.funds} <input class="num" type="number" placeholder="±金币" aria-label="${esc(p.name)} 增减金币" data-act="funds" data-player="${esc(p.id)}" data-room="${code}" data-label="金币" data-clear></td>
    <td>${field('level', p.level, '商店等级')}</td>
    <td>${p.freeRefreshes} <button data-click="refresh" data-player="${esc(p.id)}" data-room="${code}" data-label="免费刷新" aria-label="${esc(p.name)} 免费刷新 +1">+1</button></td>
    <td>${p.board} / ${p.hand}</td>
    <td>${p.ready ? '已就绪' : ''}${p.autoplay ? ' <span class="tag on">托管中</span>' : ''}
      ${p.bot ? '' : `<button ${on(code, p, 'autoplay', p.autoplay ? '取消托管' : '开启托管')} data-value="${p.autoplay ? 0 : 1}">${p.autoplay ? '取消托管' : '托管'}</button>`}</td>
    <td class="row">
      ${candidateInput('chess', code, p.id, `placeholder="发放干员…" aria-label="${esc(p.name)} 发放干员" data-grant="chess" data-player="${esc(p.id)}" data-room="${code}"`)}
      ${candidateInput('diy', code, p.id, `placeholder="发放自选…" aria-label="${esc(p.name)} 发放自选干员" data-grant="diy" data-player="${esc(p.id)}" data-room="${code}" value="${esc(diyDraft.get(p.id)?.label || '')}"`)}
      <span data-diy-sel="${esc(p.id)}">${diySelects(code, p.id)}</span>
      ${candidateInput('item', code, p.id, `placeholder="发放道具…" aria-label="${esc(p.name)} 发放道具" data-grant="item" data-player="${esc(p.id)}" data-room="${code}"`)}
      <button data-toggle="${esc(p.id)}" aria-expanded="${open.has(p.id)}">${open.has(p.id) ? '收起' : '详情'}</button>
    </td>
  </tr>${open.has(p.id) ? detailRow(code, p, 8) : ''}`;
}

// ---- statistics (shared by the rooms page and the 对局记录 page)
// series colors follow the seat order, never the rank (validated against the panel surfaces, docs/HANDOFF.md 4.8)
const SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500'];
const INK = { grid: '#2c2c2a', axis: '#383835', label: '#898781', text: '#dfe6e2', surface: '#101311' };
const METRICS = [['lp', 'LP'], ['funds', '剩余金币'], ['spent', '累计花费'], ['dmg', '累计伤害'], ['roundDmg', '本回合伤害'], ['level', '商店等级']];
const TOTALS = [['dmgDealt', '伤害'], ['kills', '击杀'], ['leaks', '漏怪'], ['perfectRounds', '无伤回合'], ['lpLost', '损失 LP'], ['fundsGained', '获得金币'],
  ['gold', '花费'], ['buys', '购买'], ['sells', '出售'], ['refreshes', '刷新'], ['merges', '晋升'], ['itemsEquipped', '配装'], ['healing', '治疗'],
  ['bossDamage', '领袖伤害'], ['activatedLayers', '盟约层数']];
const ACTION_NAMES = { rewind: '回档', endPrep: '结束休整期', pause: '暂停/继续', enemyPick: '指定敌人', battleWin: '判胜', battleLose: '判负',
  timerScale: '计时倍率', endMatch: '结束对局', funds: '金币', lp: 'LP', level: '商店等级', refresh: '免费刷新', chess: '发放干员', diy: '发放自选', diySkill: '改自选技能', item: '发放道具',
  bondAdd: '加层', bondSet: '设层', bondBonus: '人数加成', autoplay: '托管', effectRemove: '删除效果', bountyRemove: '删除悬赏', card: '补发机变卡',
  pieceRemove: '移除棋子', piecePromote: '升精锐', pieceEquip: '装备' };
const compact = new Intl.NumberFormat('zh-CN', { notation: 'compact', maximumFractionDigits: 1 });
const full = new Intl.NumberFormat('zh-CN');
const fmt = (n) => (Math.abs(n) >= 1e4 ? compact.format(n) : full.format(n));
const clock = (ms) => new Date(ms).toLocaleTimeString('zh-CN', { hour12: false });
const dur = (ms) => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)} 分 ${s % 60} 秒`; };
const outcomeText = (r) => (r.victory ? (r.hiddenCleared ? '胜利 · 隐秘核心' : '胜利') : r.reason === 'admin' ? '控制台结束' : '失败');

/** The players of a history, in seat order (the entry order), with their series color and name. */
function seriesOf(history, nameOf) {
  const last = history[history.length - 1];
  return last ? last.players.map((p, i) => ({ id: p.playerId, name: nameOf(p.playerId), color: SERIES[i] || INK.label })) : [];
}

/** Points of one player for a metric: every round alive, plus the round it was eliminated in. */
function pointsOf(history, id, key) {
  const out = [];
  let wasAlive = true;
  for (const h of history) {
    const p = h.players.find((x) => x.playerId === id);
    if (!p) continue;
    if (p.alive || wasAlive) out.push({ round: h.round, v: Number(p[key]) || 0 });
    wasAlive = p.alive;
  }
  return out;
}

function niceScale(max) {
  if (!(max > 0)) return { top: 1, step: 1 };
  const raw = max / 4;
  const pow = 10 ** Math.floor(Math.log10(raw));
  const step = Math.max(1, [1, 2, 5, 10].map((k) => k * pow).find((x) => x >= raw));
  return { top: Math.ceil(max / step) * step, step };
}

/**
 * A line chart of one metric by round, one line per player, drawn into `host`: legend, end labels, a crosshair with
 * one tooltip listing every player at that round, and a table view. `state` { metric, table } survives re-renders.
 */
function drawChart(host, history, nameOf, state) {
  host.textContent = '';
  if (!history.length) { host.innerHTML = '<p class="meta">第一回合结算后开始记录。</p>'; return; }
  const series = seriesOf(history, nameOf);
  const [key, label] = METRICS.find((x) => x[0] === state.metric) || METRICS[0];
  const bar = document.createElement('div');
  bar.className = 'row';
  bar.innerHTML = `<label>指标 <select aria-label="曲线指标">${METRICS.map(([k, l]) => `<option value="${k}" ${k === key ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <button aria-pressed="${!!state.table}">${state.table ? '看曲线' : '看表格'}</button>`;
  bar.querySelector('select').addEventListener('change', (e) => { state.metric = e.target.value; drawChart(host, history, nameOf, state); });
  bar.querySelector('button').addEventListener('click', () => { state.table = !state.table; drawChart(host, history, nameOf, state); });
  host.append(bar);
  const rounds = history.map((h) => h.round);
  if (state.table) {
    const t = document.createElement('div');
    t.className = 'xscroll';
    t.innerHTML = `<table><caption class="meta" style="text-align:left">${esc(label)}（每回合结算后）</caption>
      <thead><tr><th scope="col">回合</th>${series.map((s) => `<th scope="col" class="n">${esc(s.name)}</th>`).join('')}</tr></thead>
      <tbody>${rounds.map((r) => `<tr><th scope="row">${r}</th>${series.map((s) => { const p = pointsOf(history, s.id, key).find((x) => x.round === r); return `<td class="n">${p ? full.format(p.v) : '—'}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
    host.append(t);
    return;
  }
  const lines = series.map((s) => ({ ...s, pts: pointsOf(history, s.id, key) }));
  const W = 720, H = 260, L = 52, R = 96, T = 12, B = 30;
  const x0 = rounds[0], x1 = rounds[rounds.length - 1];
  const X = (r) => (x1 === x0 ? L + (W - L - R) / 2 : L + ((r - x0) / (x1 - x0)) * (W - L - R));
  const { top, step } = niceScale(Math.max(0, ...lines.flatMap((l) => l.pts.map((p) => p.v))));
  const Y = (v) => T + (1 - v / top) * (H - T - B);
  let svg = '';
  for (let v = 0; v <= top + 1e-9; v += step) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? INK.axis : INK.grid}" stroke-width="1"/>`;
    svg += `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" fill="${INK.label}" font-size="11">${fmt(v)}</text>`;
  }
  const every = Math.ceil(rounds.length / 15);
  rounds.forEach((r, i) => { if (i % every === 0 || i === rounds.length - 1) svg += `<text x="${X(r)}" y="${H - B + 18}" text-anchor="middle" fill="${INK.label}" font-size="11">${r}</text>`; });
  svg += `<text x="${W - R}" y="${H - 2}" text-anchor="end" fill="${INK.label}" font-size="11">回合</text>`;
  for (const l of lines) {
    if (!l.pts.length) continue;
    svg += `<polyline fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${l.pts.map((p) => `${X(p.round)},${Y(p.v)}`).join(' ')}"/>`;
    for (const p of l.pts) svg += `<circle cx="${X(p.round)}" cy="${Y(p.v)}" r="4" fill="${l.color}" stroke="${INK.surface}" stroke-width="2"/>`;
  }
  // end labels in text ink, nudged apart; the line end beside each carries the color
  const ends = lines.filter((l) => l.pts.length).map((l) => { const p = l.pts[l.pts.length - 1]; return { l, x: X(p.round), y: Y(p.v) }; }).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 13);
  const over = ends.length ? ends[ends.length - 1].y - (H - B) : 0;
  if (over > 0) for (const e of ends) e.y -= over;
  for (const e of ends) svg += `<text x="${e.x + 8}" y="${e.y + 4}" fill="${INK.text}" font-size="12">${esc(e.l.name)}</text>`;
  svg += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${INK.label}" stroke-width="1" visibility="hidden"/>`;
  svg += `<rect class="hit" x="${L - 10}" y="0" width="${W - L - R + 20}" height="${H}" fill="transparent"/>`;

  const legend = document.createElement('div');
  legend.className = 'legend';
  for (const l of lines) { const sp = document.createElement('span'); sp.style.setProperty('--c', l.color); sp.textContent = l.name; legend.append(sp); }
  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}曲线，第 ${x0}–${x1} 回合，切换到表格可读出数值"><title>${esc(label)}</title>${svg}</svg><div class="tip" role="presentation"></div>`;
  host.append(legend, wrap);

  const svgEl = wrap.querySelector('svg'), cross = wrap.querySelector('.cross'), tip = wrap.querySelector('.tip');
  wrap.querySelector('.hit').addEventListener('mousemove', (e) => {
    const box = svgEl.getBoundingClientRect();
    const k = box.width / W;
    const vx = (e.clientX - box.left) / k;
    let r = rounds[0];
    for (const x of rounds) if (Math.abs(X(x) - vx) < Math.abs(X(r) - vx)) r = x;
    cross.setAttribute('x1', X(r)); cross.setAttribute('x2', X(r)); cross.setAttribute('visibility', 'visible');
    tip.textContent = '';
    const head = document.createElement('b');
    head.textContent = `第 ${r} 回合 · ${label}`;
    tip.append(head);
    const rows = lines.map((l) => ({ l, p: l.pts.find((p) => p.round === r) })).filter((x) => x.p).sort((a, b) => b.p.v - a.p.v);
    for (const { l, p } of rows) {
      const line = document.createElement('div');
      const sw = document.createElement('span'); sw.className = 'k'; sw.style.setProperty('--c', l.color);
      const v = document.createElement('span'); v.className = 'v'; v.textContent = full.format(p.v);
      const n = document.createElement('span'); n.textContent = l.name;
      line.append(sw, v, n);
      tip.append(line);
    }
    tip.style.display = 'block';
    const px = X(r) * k;
    tip.style.left = `${px + 12 + tip.offsetWidth > box.width ? px - 12 - tip.offsetWidth : px + 12}px`;
    tip.style.top = '8px';
  });
  wrap.querySelector('.hit').addEventListener('mouseleave', () => { cross.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; });
}

/** Running totals, one row per player. players: [{ name, stats }] */
function totalsTable(players) {
  return `<div class="xscroll"><table><thead><tr><th scope="col">玩家</th>${TOTALS.map(([, l]) => `<th scope="col" class="n">${l}</th>`).join('')}</tr></thead>
    <tbody>${players.map((p) => `<tr><th scope="row">${esc(p.name)}</th>${TOTALS.map(([k]) => `<td class="n">${p.stats && p.stats[k] != null ? fmt(p.stats[k]) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/** Each player's five operators with the most damage over the recorded rounds. */
function unitsRanking(history, nameOf) {
  const series = seriesOf(history, nameOf);
  if (!series.length) return '<p class="meta">暂无</p>';
  return `<div class="units">${series.map((s) => {
    const by = new Map();
    for (const h of history) {
      const p = h.players.find((x) => x.playerId === s.id);
      for (const u of (p && p.units) || []) {
        // A host can reuse an empty DIY slot for another operator between rounds.
        const key = JSON.stringify([u.defId, u.name]);
        const e = by.get(key) || { name: u.name, dmg: 0, kills: 0, rounds: 0 };
        e.dmg += u.dmg; e.kills += u.kills; e.rounds++;
        by.set(key, e);
      }
    }
    const top = [...by.values()].sort((a, b) => b.dmg - a.dmg).slice(0, 5);
    return `<div><span class="legend"><span style="--c:${s.color}">${esc(s.name)}</span></span>
      ${top.length ? `<ol>${top.map((u) => `<li>${esc(u.name)} <span class="meta">${fmt(u.dmg)} 伤害 · ${u.kills} 击杀 · ${u.rounds} 场</span></li>`).join('')}</ol>` : '<p class="meta">没有伤害记录</p>'}</div>`;
  }).join('')}</div>`;
}

/** Any recorded round, one row per player; state.round null = follow the latest round. */
function drawRounds(host, history, nameOf, state) {
  host.textContent = '';
  if (!history.length) { host.innerHTML = '<p class="meta">第一回合结算后开始记录。</p>'; return; }
  const latest = history[history.length - 1].round;
  const h = history.find((x) => x.round === state.round) || history[history.length - 1];
  const bar = document.createElement('div');
  bar.className = 'row';
  bar.innerHTML = `<label>查看 <select aria-label="查看第几回合">${history.map((x) => `<option value="${x.round}" ${x.round === h.round ? 'selected' : ''}>第 ${x.round} 回合${x.round === latest ? '（最新）' : ''}</option>`).join('')}</select></label>
    <span class="meta">数值是该回合结算后的状态</span>
    ${h.enemy ? `<span>敌人：${esc(h.enemy.typeName)} · ${esc(h.enemy.special)}｜普 ${esc(h.enemy.normal || '—')}｜精 ${esc(h.enemy.elite || '—')}${h.enemy.fly ? '（飞行）' : ''}${h.enemy.overridden ? ' <span class="tag on">控制台指定</span>' : ''}</span>` : ''}`;
  bar.querySelector('select').addEventListener('change', (e) => {
    const r = Number(e.target.value);
    state.round = r === latest ? null : r;
    drawRounds(host, history, nameOf, state);
  });
  const t = document.createElement('div');
  t.className = 'xscroll';
  t.innerHTML = `<table><thead><tr><th scope="col">玩家</th><th scope="col" class="n">LP</th><th scope="col" class="n">扣血</th><th scope="col" class="n">漏怪</th><th scope="col" class="n">击杀</th><th scope="col" class="n">伤害</th><th scope="col">无伤</th><th scope="col" class="n">剩余金币</th><th scope="col" class="n">商店等级</th><th scope="col">干员伤害</th></tr></thead>
    <tbody>${h.players.map((p) => `<tr><th scope="row">${esc(nameOf(p.playerId))}${p.alive ? '' : ' <span class="tag off">淘汰</span>'}</th><td class="n">${p.lp}</td>
      <td class="n ${p.loss > 0 ? 'bad' : ''}">${p.loss > 0 ? `−${p.loss}` : 0}</td><td class="n">${p.leaks}</td><td class="n">${p.kills}</td><td class="n">${fmt(p.roundDmg)}</td>
      <td>${p.perfect ? '<span class="good">是</span>' : ''}</td><td class="n">${p.funds}</td><td class="n">${p.level}</td>
      <td style="white-space:normal;min-width:240px">${(p.units || []).map((u) => `${esc(u.name)} <span class="meta">${fmt(u.dmg)}</span>`).join('、') || '<span class="meta">—</span>'}</td></tr>`).join('')}</tbody></table>`;
  host.append(bar, t);
}

/**
 * One round's operators ranked by damage — every player's together, or one player's. A bar per row in the player's
 * series color (the player column names it too); `share` = the operator's part of its player's operator damage that
 * round. state { round: null = the latest, player: '' = everyone, all: false = top 10 }.
 */
function drawUnitRounds(host, history, nameOf, state) {
  host.textContent = '';
  if (!history.length) { host.innerHTML = '<p class="meta">第一回合结算后开始记录。</p>'; return; }
  const latest = history[history.length - 1].round;
  const h = history.find((x) => x.round === state.round) || history[history.length - 1];
  const colorOf = new Map(h.players.map((p, i) => [p.playerId, SERIES[i] || INK.label]));
  const rows = [];
  for (const p of h.players) {
    if (state.player && p.playerId !== state.player) continue;
    const units = p.units || [];
    const sum = units.reduce((n, u) => n + u.dmg, 0);
    for (const u of units) rows.push({ ...u, playerId: p.playerId, share: sum > 0 ? u.dmg / sum : 0 });
  }
  rows.sort((a, b) => b.dmg - a.dmg || b.kills - a.kills);
  const shown = state.all ? rows : rows.slice(0, 10);
  const max = rows.length ? rows[0].dmg : 0;
  const bar = document.createElement('div');
  bar.className = 'row';
  bar.innerHTML = `<label>查看 <select data-k="round" aria-label="查看第几回合">${history.map((x) => `<option value="${x.round}" ${x.round === h.round ? 'selected' : ''}>第 ${x.round} 回合${x.round === latest ? '（最新）' : ''}</option>`).join('')}</select></label>
    <label>玩家 <select data-k="player" aria-label="只看哪个玩家"><option value="">全部</option>${h.players.map((p) => `<option value="${esc(p.playerId)}" ${p.playerId === state.player ? 'selected' : ''}>${esc(nameOf(p.playerId))}</option>`).join('')}</select></label>
    ${rows.length > 10 ? `<button aria-pressed="${!!state.all}">${state.all ? '只看前 10' : `看全部 ${rows.length} 个`}</button>` : ''}
    ${h.enemy ? `<span class="meta">敌人：${esc(h.enemy.typeName)} · ${esc(h.enemy.special)}</span>` : ''}`;
  bar.querySelector('[data-k="round"]').addEventListener('change', (e) => {
    const r = Number(e.target.value);
    state.round = r === latest ? null : r;
    drawUnitRounds(host, history, nameOf, state);
  });
  bar.querySelector('[data-k="player"]').addEventListener('change', (e) => { state.player = e.target.value; drawUnitRounds(host, history, nameOf, state); });
  bar.querySelector('button')?.addEventListener('click', () => { state.all = !state.all; drawUnitRounds(host, history, nameOf, state); });
  const t = document.createElement('div');
  t.className = 'xscroll';
  t.innerHTML = rows.length ? `<table><thead><tr><th scope="col" class="n">#</th><th scope="col">干员</th><th scope="col">玩家</th><th scope="col" class="n">伤害</th><th scope="col" style="min-width:160px"><span class="sr-only">伤害条</span></th><th scope="col" class="n">击杀</th><th scope="col" class="n">占本人</th></tr></thead>
    <tbody>${shown.map((u, i) => `<tr><td class="n">${i + 1}</td><th scope="row">${esc(u.name)}</th><td>${esc(nameOf(u.playerId))}</td><td class="n">${full.format(u.dmg)}</td>
      <td><span class="dmg-bar" style="--c:${colorOf.get(u.playerId)};width:${max > 0 ? Math.max(1, (u.dmg / max) * 100) : 0}%"></span></td>
      <td class="n">${u.kills}</td><td class="n">${pct(u.share)}</td></tr>`).join('')}</tbody></table>`
    : '<p class="meta">这回合没有干员伤害记录（比如没有干员上场）。</p>';
  host.append(bar, t);
}

/** One composition as a line: special｜普 normal｜精 elite. */
const comboText = (c) => `${c.special}｜普 ${c.normalName || '—'}｜精 ${c.eliteName || '—'}${c.fly ? '（飞行）' : ''}`;
const pct = (x) => `${(x * 100).toFixed(x >= 0.1 ? 0 : 1)}%`;

/**
 * The enemy schedule: per round its type, the composition it has now, and a picker over EVERY composition of the round's
 * half, grouped by type — the round's own type first (with the official chance of each), then this match's other
 * types, then the types this match did not draw and the mode's disabled ones (selectable, marked impossible).
 */
function planTable(code, plan) {
  const byId = new Map([...plan.lists.first, ...plan.lists.second].map((c) => [c.id, c]));
  const rows = plan.rounds.map((r) => {
    const list = plan.lists[r.half];
    const cur = byId.get(r.current);
    const orig = byId.get(r.original);
    const possible = Object.values(r.chance).filter((x) => x > 0).length;
    const groups = new Map();
    for (const c of list) {
      const g = !c.allowed ? 'off' : c.type === r.type ? 'own' : c.inMatch ? 'match' : 'other';
      const key = g === 'off' ? 'off' : `${g}|${c.type}`; // the mode's disabled ones: one group
      if (!groups.has(key)) groups.set(key, { g, c, items: [] });
      groups.get(key).items.push(c);
    }
    const order = { own: 0, match: 1, other: 2, off: 3 };
    const label = { own: '本回合类型', match: '本局类型，本回合不会出', other: '本局没有这个类型', off: '本模式禁用' };
    const opts = [...groups.values()].sort((a, b) => order[a.g] - order[b.g]).map(({ g, c, items }) => `<optgroup label="${g === 'off' ? '' : `${esc(c.typeName)}`}（${label[g]}）">${items.map((x) => {
      const ch = r.chance[x.id];
      return `<option value="${esc(x.id)}" ${x.id === r.current ? 'selected' : ''}>${g === 'off' ? `${esc(x.typeName)} · ` : ''}${esc(comboText(x))}${ch ? ` · ${pct(ch)}` : g === 'own' ? '' : ' · 不可能'}${x.id === r.original ? ' · 原定' : ''}</option>`;
    }).join('')}</optgroup>`).join('');
    return `<tr><th scope="row">${r.round}${r.kind === 'boss' ? ' <span class="tag">领袖</span>' : r.kind === 'hidden' ? ' <span class="tag">隐秘核心</span>' : ''}</th>
      <td>${esc(r.typeName || '—')}</td>
      <td style="white-space:normal;min-width:260px">${cur ? esc(comboText(cur)) : '<span class="meta">—</span>'}${r.overridden ? ` <span class="tag on">已指定</span><br><span class="meta">原定：${orig ? esc(comboText(orig)) : '—'}</span>` : ''}</td>
      <td style="white-space:normal;min-width:200px">${r.roster.map((e) => `${esc(e.name)}${e.boss ? '<span class="meta">（领袖）</span>' : ''} ×${e.count}`).join('、') || '<span class="meta">—</span>'}</td>
      <td class="n">${possible}</td>
      <td><select data-pick="${r.round}" data-current="${esc(r.current || '')}" data-room="${code}" aria-label="第 ${r.round} 回合的敌人组合" ${r.editable ? '' : 'disabled'} style="max-width:420px">${opts}</select>
        ${r.overridden && r.editable ? `<button data-click="enemyPick" data-room="${code}" data-pick-clear="${r.round}" data-label="第 ${r.round} 回合恢复原定">恢复原定</button>` : ''}</td></tr>`;
  }).join('');
  return `<p class="meta">开局时就定好了每回合的类型（本局 3 类 + 特异）和组合，游戏里不给玩家看。下拉框里是该回合（前半 1–${plan.rounds.filter((r) => r.half === 'first').length} 回合 / 后半）所有组合；百分比是按本局日程官方抽到它的概率，「不可能」的也能指定。
    本回合的只能在战斗开始前改，之后的回合随时可以改，那一回合开始时生效。「实际出怪」按该回合的出怪模板算：第 1–3 回合的模板没有特殊位，地面组合不出飞行位、飞行组合不出地面位，领袖回合只出精英护卫，所以组合里的怪不一定都会出现。回档会恢复当时的指定。</p>
    <div class="xscroll"><table><thead><tr><th scope="col">回合</th><th scope="col">类型</th><th scope="col">组合</th><th scope="col">实际出怪（不含悬赏）</th><th scope="col" class="n">本回合可能的组合数</th><th scope="col">改为</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function logTable(log) {
  if (!log.length) return '<p class="meta">还没有操作。</p>';
  return `<div class="scroll"><table><thead><tr><th scope="col">时间</th><th scope="col">回合</th><th scope="col">操作</th><th scope="col">玩家</th><th scope="col">参数</th><th scope="col">结果</th></tr></thead>
    <tbody>${log.slice().reverse().map((e) => `<tr><td>${clock(e.at)}</td><td>${e.round ?? ''}</td><td>${esc(ACTION_NAMES[e.action] || e.action)}</td><td>${esc(e.player || '')}</td>
      <td>${esc(idNames.get(e.value) || e.value)}</td><td class="${e.ok ? 'good' : 'bad'}">${e.ok ? '完成' : esc(e.error || '失败')}</td></tr>`).join('')}</tbody></table></div>`;
}

/**
 * One room's statistics, kept out of the 1.5 s re-render: the node moves back into the fresh room card and each part
 * is redrawn only when its own data changed (a hover tooltip or an open select survives the poll).
 */
const panels = new Map();
function statsPanel(r) {
  let p = panels.get(r.code);
  if (!p) {
    const el = document.createElement('div');
    el.innerHTML = `<details class="stats" data-match open><summary>本局统计</summary><div class="stats-body">
        <div class="row" data-part="ended"></div>
        <div><h3>每回合曲线</h3><div data-part="chart"></div></div>
        <div><h3>每回合详情</h3><div data-part="rounds"></div></div>
        <div><h3>每回合干员伤害排行</h3><div data-part="unitRounds"></div><p class="meta">伤害是实际扣掉的敌人血量（不算溢出），只算各自战场；召唤物不单列。</p></div>
        <div><h3>累计数据</h3><div data-part="totals"></div><p class="meta">花费 = 实际花掉的金币；获得金币含利息、悬赏和控制台加的。</p></div>
        <div><h3>本局干员伤害排行（累计前 5）</h3><div data-part="units"></div><p class="meta">只算各自战场里的伤害；联防里的伤害计入累计数据，但不分干员。</p></div>
      </div></details>
      <details class="stats" data-plan><summary>敌人日程（剧透：游戏里对玩家隐藏）</summary><div class="stats-body" data-part="plan"></div></details>
      <details class="stats"><summary>控制台操作日志</summary><div class="stats-body" data-part="log"></div></details>`;
    p = { el, seen: {}, chart: { metric: 'lp', table: false }, rounds: { round: null }, unitRounds: { round: null, player: '', all: false } };
    panels.set(r.code, p);
  }
  // the running match, else the room's last ended one (kept until its next match starts)
  const m = r.match || r.lastMatch;
  const ended = !r.match && !!r.lastMatch;
  const names = new Map(m ? m.players.map((x) => [x.id, x.name]) : []);
  const nameOf = (id) => names.get(id) || id;
  const part = (k, data, draw) => {
    const json = JSON.stringify(data);
    if (p.seen[k] === json) return;
    p.seen[k] = json;
    draw(p.el.querySelector(`[data-part="${k}"]`));
  };
  p.el.querySelector('details[data-match]').hidden = !m;
  if (m) {
    part('ended', [ended, ended && r.lastMatch.savedAt], (host) => {
      p.el.querySelector('details[data-match] > summary').textContent = ended ? '上一局统计' : '本局统计';
      host.hidden = !ended;
      host.innerHTML = ended ? `<span class="${r.lastMatch.victory ? 'good' : 'bad'}">${outcomeText(r.lastMatch)}</span>
        <span class="meta">${clock(r.lastMatch.savedAt)} 结束 · 通过 ${r.lastMatch.roundsPassed ?? 0} 回合 · 下一局开始前一直显示</span>
        ${r.lastMatch.id ? `<button data-open-record="${esc(r.lastMatch.id)}">查看完整记录</button>` : '<span class="bad">记录没能保存（见服务器日志）</span>'}` : '';
    });
    // the round picker starts over at the latest round when the match shown changes (live ↔ ended)
    const key = ended ? r.lastMatch.savedAt : 'live';
    if (p.matchKey !== key) { p.matchKey = key; p.rounds.round = null; p.unitRounds = { round: null, player: '', all: false }; }
    part('chart', [m.history, [...names]], (host) => drawChart(host, m.history, nameOf, p.chart));
    part('rounds', [m.history, [...names]], (host) => drawRounds(host, m.history, nameOf, p.rounds));
    part('unitRounds', [m.history, [...names]], (host) => drawUnitRounds(host, m.history, nameOf, p.unitRounds));
    part('totals', m.players.map((x) => [x.name, x.stats]), (host) => { host.innerHTML = totalsTable(m.players); });
    part('units', [m.history.length, [...names]], (host) => { host.innerHTML = unitsRanking(m.history, nameOf); });
  }
  p.el.querySelector('details[data-plan]').hidden = !(r.match && r.match.enemyPlan);
  if (r.match && r.match.enemyPlan) part('plan', r.match.enemyPlan, (host) => { host.innerHTML = planTable(r.code, r.match.enemyPlan); });
  part('log', [r.log, idNames.size], (host) => { host.innerHTML = logTable(r.log); });
  return p.el;
}

        <tbody>${players.map((p) => `<tr><th scope="row">${esc(p.name)}${p.isBot ? ' <span class="tag">AI</span>' : ''}${p.alive ? '' : ` <span class="tag off">第 ${p.eliminatedRound ?? '?'} 回合淘汰</span>`}</th>
          <td>${p.title ? esc(p.title.name || p.title.id) : ''}</td><td class="n">${p.roundsPassed}</td><td class="n">${p.lp}</td><td>${esc(p.band || '')}</td>
          <td style="white-space:normal;min-width:260px">${(p.lineup || []).map((u) => `${esc(u.name)}${u.golden ? '<span class="on">·精锐</span>' : ''}${u.items && u.items.length ? `<span class="meta">（${u.items.map(esc).join('、')}）</span>` : ''}`).join('、') || '<span class="meta">空</span>'}</td>
          <td style="white-space:normal;min-width:160px">${(p.bonds || []).map((b) => `<span class="${b.active ? 'on' : 'meta'}">${esc(b.name)}${b.layers ? ` ${b.layers} 层` : ''}</span>`).join('、')}</td></tr>`).join('')}</tbody></table></div></div>
      <div><h3>每回合曲线</h3><div data-part="chart"></div></div>
      <div><h3>每回合详情</h3><div data-part="rounds"></div></div>
      <div><h3>每回合干员伤害排行</h3><div data-part="unitRounds"></div></div>
      <div><h3>累计数据</h3>${totalsTable(players)}</div>
      <div><h3>本局干员伤害排行（累计前 5）</h3>${unitsRanking(history, nameOf)}</div>
    </div></section>`;

}


// ---- 设置: the 休整期 timer for every room and match (server/match/hostSettings.js, logs/admin-settings.json)
const PREP_MODES = [['default', '按游戏数据（默认）'], ['scale', '按倍率'], ['fixed', '每回合相同'], ['perRound', '按回合指定'], ['untimed', '不限时']];
let settingsData = null;
let releaseUpdate = { state: 'idle' };
let updateRequest = false;
let updatePoll = null;
let reconnectStarted = 0;
let selectedRelease = '';
let releaseSelectionTouched = false;
let networkDraft = null;
let networkFeedback = '';
let networkExpanded = false;

function drawReleaseUpdate() {
  const host = $('#release-update');
  if (!host) return;
  const d = releaseUpdate;
  const versions = d.versions || [];
  if (!releaseSelectionTouched || !versions.some((r) => r.tag === selectedRelease)) selectedRelease = d.target || versions.find((r) => r.relation === 'new')?.tag || d.currentVersion || '';
  const selected = versions.find((r) => r.tag === selectedRelease);
  const network = networkDraft || d.network || { proxy: '', mirror: 'https://gh-proxy.com/' };
  networkExpanded = host.querySelector('details')?.open ?? networkExpanded;
  const busy = updateRequest || ['checking', 'downloading', 'verifying', 'scheduled'].includes(d.state);
  const messages = {
    idle: '首次打开控制台会自动检查更新，也可手动刷新版本列表。', checking: '正在获取 Release 版本列表…',
    available: '发现新版本，请选择要安装的版本。', 'up-to-date': '未发现比当前版本更新的正式 Release。可选择旧版本回退。',
    downloading: `正在下载安装包…${d.received ? ` ${(d.received / 1048576).toFixed(1)} / ${(d.size / 1048576).toFixed(1)} MB` : ''}`,
    verifying: '正在校验程序文件…', 'active-matches': '有正在进行的对局，安装前需要确认结束对局。',
    scheduled: '更新已校验，服务器即将重启。恢复连接后此页面会自动刷新。',
    reconnecting: '正在安装并等待服务器恢复…',
  };
  host.innerHTML = `<h2>版本更新</h2>
    <p class="meta">从 ${esc(d.repository || 'zhewang448/Stronghold-Protocol')} 下载正式 Release。保留本机素材、主机设置和对局记录；替换前备份程序文件，安装完成后自动重启。</p>
    <div class="row"><span>当前版本：<strong>${esc(d.currentVersion || '读取中…')}</strong></span>
      ${d.latestVersion ? `<span>最新版本：<strong>${esc(d.latestVersion)}</strong></span>` : ''}</div>
    <p><label for="release-version-select">选择版本</label><br><select id="release-version-select" ${busy || d.state === 'reconnecting' ? 'disabled' : ''}>
      ${versions.length ? versions.map((r) => `<option value="${esc(r.tag)}" ${r.tag === selectedRelease ? 'selected' : ''}>${esc(r.tag)} · ${{ new: '新版本', current: '当前版本', old: '旧版本' }[r.relation]}${r.reason ? ' · 不可安装' : ''}</option>`).join('') : '<option value="">检查后显示可选版本</option>'}</select></p>
    ${selected?.asset ? `<p class="meta" style="overflow-wrap:anywhere">安装包：${esc(selected.asset)}${selected.size ? ` · ${(selected.size / 1048576).toFixed(1)} MB` : ''}${selected.publishedAt ? ` · 发布于 ${esc(new Date(selected.publishedAt).toLocaleDateString())}` : ''} · ${selected.signed ? '已签名' : '未签名'}</p>` : ''}
    ${selected?.reason ? `<p class="note">该版本不可安装：${esc(selected.reason)}</p>` : ''}
    ${selected?.relation === 'old' ? '<p class="note">回退旧版本可能不兼容新版功能或记录。安装前会备份程序文件。</p>' : ''}
    <p id="release-update-state" role="status" aria-live="polite" ${d.error ? 'class="bad"' : 'class="meta"'}>${esc(d.error ? `更新失败：${d.error}。可重新检查后重试。` : messages[d.state] || '')}</p>
    <div class="row"><button data-update-check ${busy || d.state === 'reconnecting' || d.state === 'active-matches' ? 'disabled' : ''}>检查更新</button>

document.addEventListener('change', (e) => {
  if (e.target.id !== 'release-version-select') return;
  selectedRelease = e.target.value;
  releaseSelectionTouched = true;
  drawReleaseUpdate();
  $('#release-version-select')?.focus();

document.addEventListener('input', (e) => {
  if (!e.target.closest('#update-network-form')) return;
  networkDraft = { proxy: $('#update-proxy').value, mirror: $('#update-mirror').value };

async function saveUpdateNetwork() {

async function openUpdateConsole() {

  } catch { releaseUpdate = { ...releaseUpdate, state: 'error', error: '自动检查失败，请在设置中配置网络后重试' }; drawReleaseUpdate(); }

function startUpdatePolling() {
  if (updatePoll) return;
  updatePoll = setInterval(async () => {
    try {
      const d = await api('/api/update');
      if (d.error === 'bad token' && (reconnectStarted || releaseUpdate.state === 'scheduled')) { location.reload(); return; }
      if (d.error && !d.state) throw new Error(d.error);
      if (reconnectStarted && !['scheduled', 'downloading', 'verifying'].includes(d.state)) { location.reload(); return; }
      releaseUpdate = d;
      drawReleaseUpdate();
      if (!['checking', 'downloading', 'verifying', 'scheduled'].includes(d.state)) {
        clearInterval(updatePoll); updatePoll = null;
      }
    } catch {
      if (releaseUpdate.state === 'scheduled' || reconnectStarted) {
        reconnectStarted ||= Date.now();
        releaseUpdate = { ...releaseUpdate, state: 'reconnecting' };
        if (Date.now() - reconnectStarted > 120000) {
          clearInterval(updatePoll); updatePoll = null;
          releaseUpdate = { ...releaseUpdate, state: 'error', error: '服务器尚未恢复，请检查 logs/release-update-status.json 和 logs/release-restart.log，恢复后刷新页面' };
        }
      } else {
        clearInterval(updatePoll); updatePoll = null;
        releaseUpdate = { ...releaseUpdate, state: 'error', error: '连接服务器失败，请重新检查更新' };
      }
      drawReleaseUpdate();
    }
  }, 750);
}

async function updateRelease(action, force = false, allowDowngrade = false) {
  if (updateRequest) return;
  if (action === 'install' && !allowDowngrade && releaseUpdate.versions?.find((r) => r.tag === selectedRelease)?.relation === 'old') {
    if (!confirm(`确定从 ${releaseUpdate.currentVersion} 回退到 ${selectedRelease}？旧版本可能不兼容新版功能或记录，服务器将重启。`)) return;
    allowDowngrade = true;
  }
  if (action === 'install' && releaseUpdate.state === 'active-matches') {
    if (!confirm('当前有正在进行的对局。安装会结束全部对局并重启服务器，确定继续？')) return;
    force = true;
  }
  updateRequest = true;
  if (action === 'check' || action === 'more') releaseUpdate = { ...releaseUpdate, state: 'checking', error: undefined };
  drawReleaseUpdate();
  try {
    releaseUpdate = await api('/api/update', { action, tag: selectedRelease, force, allowDowngrade });
    if (releaseUpdate.state === 'active-matches' && action === 'install' && !force) {
      updateRequest = false;
      drawReleaseUpdate();
      await updateRelease('install', false, allowDowngrade);
      return;
    }
    if (['checking', 'downloading', 'verifying', 'scheduled'].includes(releaseUpdate.state)) startUpdatePolling();
  } catch { releaseUpdate = { ...releaseUpdate, state: 'error', error: '连接服务器失败，请重新检查更新' }; }
  finally { updateRequest = false; drawReleaseUpdate(); }
}

/** As hostSettings.prepSecondsFor. */
function prepFor(round, base, p) {
  if (!(base > 0)) return null;
  if (p.mode === 'scale') return Math.max(1, Math.round(base * p.scale));
  if (p.mode === 'fixed') return p.seconds;
  if (p.mode === 'perRound') return Object.hasOwn(p.rounds, round) ? p.rounds[round] : base;
  if (p.mode === 'untimed') return null;
  return base;
}

/** The form's setting (unvalidated: the server checks it). */
function prepForm() {
  const f = $('#prep-form');
  const mode = f.querySelector('input[name="prep-mode"]:checked').value;
  const rounds = {};
  for (const el of f.querySelectorAll('input[data-prep-round]')) if (el.value !== '') rounds[el.dataset.prepRound] = Number(el.value);
  return { mode, scale: Number(f.querySelector('#prep-scale').value), seconds: Number(f.querySelector('#prep-seconds').value), rounds };
}

/** Modes with the same default timers share a column. */
function prepGroups(defaults) {
  const groups = [];
  for (const d of defaults) {
    const g = groups.find((x) => x.rounds.join() === d.rounds.join());
    if (g) g.names.push(d.name); else groups.push({ names: [d.name], rounds: d.rounds });
  }
  return groups;
}

function drawPrepPreview() {
  const p = prepForm();
  const groups = prepGroups(settingsData.defaults);
  const n = Math.max(0, ...groups.map((g) => g.rounds.length));
  const cell = (s) => (s == null ? '<span class="meta">不限时</span>' : `${s} 秒`);
  $('#prep-preview').innerHTML = `<table><caption class="meta" style="text-align:left">默认 → 按上面的设置（未保存的修改也会显示在这里）</caption>
    <thead><tr><th scope="col">回合</th>${groups.map((g) => `<th scope="col">${esc([...new Set(g.names)].join('、'))}</th>`).join('')}</tr></thead>
    <tbody>${Array.from({ length: n }, (_, i) => i + 1).map((r) => `<tr><th scope="row">${r}</th>${groups.map((g) => {
      const base = g.rounds[r - 1];
      if (base == null) return '<td class="meta">—</td>';
      const now = prepFor(r, base, p);
      return `<td>${cell(base)}${now !== base ? ` → <span class="on">${cell(now)}</span>` : ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
}

function closeCandidates(el) {
  const box = el.parentElement.querySelector('[data-candidates]');
  if (box) box.hidden = true;
  el.setAttribute('aria-expanded', 'false');
  el.removeAttribute('aria-activedescendant');
}

function drawCandidates(el, message = null) {
  const q = el.value.trim().toLocaleLowerCase();
  const box = el.parentElement.querySelector('[data-candidates]');
  if (!box) return [];
  const kind = el.dataset.candidateKind;
  const all = kind === 'diy' ? [...diyEntries.keys()] : [...$(`#${kind}-list`).options].map((o) => o.value);
  const labels = q && !message ? all.filter((label) => label.toLocaleLowerCase().includes(q)) : [];
  box.replaceChildren(...labels.map((label, i) => {
    const option = document.createElement('span');
    option.setAttribute('role', 'option');
    option.dataset.candidateOption = label;
    option.id = `${box.id}-${i}`;
    option.setAttribute('aria-selected', 'false');
    option.textContent = label;
    return option;
  }));
  if (q && !labels.length) box.textContent = message || (kind === 'diy' || kind === 'chess' ? '没有符合条件的干员' : '没有符合条件的候选项');
  box.hidden = !q;
  if (!box.hidden) {
    const r = el.getBoundingClientRect();
    box.style.left = `${Math.max(8, Math.min(r.left, innerWidth - 8 - box.offsetWidth))}px`;
    box.style.maxHeight = '240px';
    const below = innerHeight - r.bottom - 10;
    const above = r.top - 10;
    const openAbove = below < box.offsetHeight && above > below;
    const height = Math.min(240, Math.max(0, openAbove ? above : below));
    box.style.maxHeight = `${height}px`;
    box.style.top = `${openAbove ? r.top - box.offsetHeight - 2 : r.bottom + 2}px`;
  }
  el.setAttribute('aria-expanded', String(!box.hidden));
  el.removeAttribute('aria-activedescendant');
  return labels;
}

function chooseCandidate(el, label) {
  el.value = label;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  closeCandidates(el);
  el.focus();
}

  const box = el.parentElement.querySelector('[data-candidates]');

    e.preventDefault();

    const next = (i + (e.key === 'ArrowDown' ? 1 : i < 0 ? 0 : -1) + options.length) % options.length;
    options.forEach((o, j) => o.setAttribute('aria-selected', String(j === next)));

    options[next].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && !box.hidden) {
    const option = box.querySelector('[aria-selected="true"]') || (el.dataset.candidateKind === 'diy' && !names.diy.has(el.value) && box.querySelector('[data-candidate-option]'));

  if (replaySave) {
    const input = $('#replay-enabled'), saved = $('#replay-saved');
    replaySave.disabled = input.disabled = true; saved.textContent = '保存中…';
    api('/api/settings', { replay: { enabled: input.checked } }).catch(() => ({ error: '连接服务器失败' })).then((r) => {
      saved.textContent = r.ok ? '已保存' : `保存失败：${r.error}`;
      if (r.ok) { settingsData.replay = r.replay; input.checked = r.replay.enabled; }
    }).finally(() => { replaySave.disabled = input.disabled = !!settingsData.replay.forcedOff; });
    return;
  }
  if (e.target.closest('button[data-unite-layers-reset]')) {
    $('#unite-layers-enabled').checked = !!settingsData.uniteLayerGains;
    $('#unite-layers-saved').textContent = '';
    return;
  }
  const uniteSave = e.target.closest('button[data-unite-layers-save]');
  if (uniteSave) {
    const checkbox = $('#unite-layers-enabled');
    const saved = $('#unite-layers-saved');
    const reset = $('#unite-layers-form [data-unite-layers-reset]');
    const uniteLayerGains = checkbox.checked;
    uniteSave.disabled = checkbox.disabled = reset.disabled = true;
    saved.textContent = '保存中…';
    api('/api/settings', { uniteLayerGains }).catch(() => ({ error: '连接服务器失败' })).then((r) => {
      if (r.ok) {
        settingsData.uniteLayerGains = r.uniteLayerGains;
        checkbox.checked = r.uniteLayerGains;
        saved.textContent = '已保存，从下一次联防开始生效';
      } else { saved.textContent = `保存失败：${r.error}`; say(saved.textContent, true); }
    }).finally(() => { uniteSave.disabled = checkbox.disabled = reset.disabled = false; });
    return;
  }
  if (e.target.closest('button[data-prep-reset]')) { showSettings(); return; }
  if (e.target.closest('button[data-prep-save]')) {
    api('/api/settings', { prep: prepForm() }).catch(() => ({ error: '连接服务器失败' })).then((r) => {
      if (r.ok) { say('休整期设置：已保存'); showSettings().then(() => { $('#prep-saved').textContent = '已保存'; }); }
      else say(`休整期设置失败：${r.error}`, true);
    });
    return;
  }
  const rec = e.target.closest('button[data-record]');
  if (rec) { showRecord(rec.dataset.record); return; }
  const t = e.target.closest('button[data-toggle]');
  if (t) {
    const id = t.dataset.toggle;
    if (open.has(id)) open.delete(id); else open.add(id);
    lastJson = '';
    refresh();
    return;
  }
  const b = e.target.closest('button[data-click]');
  if (!b || b.disabled) return;
  const v = b.dataset.from ? $(b.dataset.from).value : b.dataset.value;
  if (b.dataset.confirm && !confirm(b.dataset.confirm.replace('{v}', v))) return;
  act(b.dataset.room, b.dataset.click, b.dataset.player, valueOf(b, v), b.dataset.label);
});
async function setTab(name) {
  for (const b of document.querySelectorAll('button[data-tab]')) b.setAttribute('aria-pressed', String(b.dataset.tab === name));
  for (const id of ['rooms', 'records', 'settings']) $(`#${id}`).hidden = name !== id;
  if (name === 'records') await showRecords();
  else if (name === 'settings') await showSettings();
  else { lastJson = ''; refresh(); }
}
document.addEventListener('change', (e) => {
  const el = e.target;
  if (!el.matches('select[data-pick]')) return;
  const round = Number(el.dataset.pick);
  const text = el.selectedOptions[0] ? el.selectedOptions[0].textContent : '';
  el.blur();
  if (!confirm(`第 ${round} 回合的敌人改为：${text}？`)) { el.value = el.dataset.current; return; }
  act(el.dataset.room, 'enemyPick', null, { round, id: el.value }, `第 ${round} 回合敌人`);
});
/** The action's value: { bond, n } / { field, n } when the control names a bond / a field, else the plain value. */
function valueOf(el, v) {
  if (el.dataset.pickClear) return { round: Number(el.dataset.pickClear), id: '' };
  if (el.dataset.bond) return { bond: el.dataset.bond, n: v };
  if (el.dataset.field) return { field: el.dataset.field, n: v };
  return v;
}
document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (e.defaultPrevented || e.isComposing || e.keyCode === 229 || e.key !== 'Enter' || !el.matches('input')) return;
  if (el.dataset.act && el.value !== '') {
    act(el.dataset.room, el.dataset.act, el.dataset.player, valueOf(el, el.value), el.dataset.label);
    if ('clear' in el.dataset) el.value = '';
    el.blur();
  } else if (el.dataset.equip) {
    const id = names.equip.get(el.value) || el.value.trim();
    if (!id) return;
    act(el.dataset.room, 'pieceEquip', el.dataset.player, { target: Number(el.dataset.equip), item: id }, '装备');
    el.value = '';
    el.blur();
  } else if (el.dataset.grant === 'diy') {
    loadCatalog(el.dataset.room).then(() => {
      const v = diyValue(el.dataset.player, el.value);
      if (!v) { if (el.value.trim()) say(`没有这一项：${el.value.trim()}`, true); return; }
      idNames.set(JSON.stringify(v), diyLabel(el.value, v));
      act(el.dataset.room, 'diy', el.dataset.player, v, '发放自选');
      el.blur();
    });
  } else if (el.dataset.grant) {
    loadCatalog(el.dataset.room).then(() => {
      const id = names[el.dataset.grant].get(el.value) || (el.dataset.grant === 'diy' ? null : el.value.trim());
      if (!id) { if (el.value.trim()) say(`没有这一项：${el.value.trim()}`, true); return; }
      act(el.dataset.room, el.dataset.grant, el.dataset.player, id, { chess: '发放干员', diy: '发放自选', item: '发放道具', card: '补发机变卡' }[el.dataset.grant]);
      el.value = '';
      el.blur();
    });
  }
});
refresh();
setInterval(refresh, 1500);
openUpdateConsole();
</script>
</body>
</html>
