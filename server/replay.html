<!doctype html>
<!-- i18n-ignore-file: host-only Chinese console -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="admin-token" content="__TOKEN__">
<title>整局回放 · 主机控制台</title>
<script type="importmap">{"imports":{"preact":"/vendor/preact.module.js","preact/hooks":"/vendor/hooks.module.js","htm":"/vendor/htm.module.js"}}</script>
<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/pixi-spine.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0c0f0e; --panel: #141816; --line: #2f3a35; --mint: #4ed8af; --text: #dfe6e2; --dim: #8a9a92; --warn: #f6a329; --red: #e85a4a; }
  * { box-sizing: border-box; scrollbar-color: var(--line) var(--bg); }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); }
  ::selection { color: var(--bg); background: var(--mint); }
  a { color: var(--mint); text-underline-offset: 3px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 8px 0 0; font-size: 20px; }
  h2 { margin: 0; font-size: 17px; }
  h3 { margin: 14px 0 4px; font-size: 14px; }
  p { margin: 6px 0; }
  .meta { color: var(--dim); overflow-wrap: anywhere; }
  .warn { color: var(--warn); }
  .bad { color: var(--red); }
  .good { color: var(--mint); }
  #notice { padding: 10px 20px; border-bottom: 1px solid var(--line); }
  main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 1800px; margin: auto; }
  aside { min-width: 0; }
  #timeline { max-height: calc(100vh - 230px); overflow: auto; padding-right: 8px; }
  #timeline details { border-bottom: 1px solid var(--line); padding: 10px 0; }
  summary { cursor: pointer; }
  .field-choice { display: block; text-align: left; width: 100%; margin: 8px 0; }
  .field-choice[aria-pressed="true"] { border-color: var(--mint); color: var(--mint); }
  button, select { font: inherit; color: var(--text); background: #1e2421; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--mint); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  #player { min-width: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  #field { position: relative; height: clamp(270px, 47vw, 650px); background: #101311; border: 1px solid var(--line); overflow: hidden; }
  #field canvas { display: block; }
  #digest { min-height: 26px; font-variant-numeric: tabular-nums; }
  .xscroll { overflow-x: auto; }
  table { width: 100%; min-width: 620px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th[scope="row"] { min-width: 90px; white-space: nowrap; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: normal; }
  td { min-width: 75px; overflow-wrap: anywhere; }
  ul { margin: 4px 0; padding-left: 20px; }
  .enemy-list { display: flex; gap: 6px 18px; flex-wrap: wrap; }
  @media (max-width: 800px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 16px; }
    #timeline { max-height: 260px; }
    header { padding: 12px; }
    #notice { padding: 10px 12px; }
  }
</style>
</head>
<body>
<header><a href="/">返回主机控制台</a><h1>整局回放</h1><p class="meta" id="match-meta">正在读取记录…</p></header>
<p id="notice" role="status" aria-live="polite">正在读取回放…</p>
<main hidden>
  <aside aria-label="回合时间线"><h2>回合与战场</h2><p class="meta">选择战场查看阵容和已采纳结果。</p><div id="timeline"></div></aside>
  <section id="player" aria-label="战场详情">
    <h2 id="field-title" tabindex="-1">选择一个战场</h2>
    <p id="field-meta" class="meta"></p>
    <div class="controls">
      <button id="play" disabled>播放战斗</button><button id="pause" disabled>暂停</button><button id="restart" disabled>重新播放</button>
      <label>倍速 <select id="speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
    </div>
    <div id="field" hidden aria-label="战斗画面"></div>
    <p id="digest" role="status" aria-live="polite"></p>
    <div id="details"></div>
  </section>
</main>
<script type="module" src="/replay-viewer.js"></script>
</body>
</html>
